name: Build RAK3401 Legion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'

concurrency:
  group: legion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [legion, baseline]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tools
        run: python -m pip install -r requirements.txt
      - name: Check checkout protection and release validation
        run: python -m unittest discover -s tests -v
      - name: Build firmware and package source
        run: python scripts/build.py --target '${{ matrix.target }}'
      - name: Upload firmware, source and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RAK3401-${{ matrix.target }}-${{ github.sha }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish experimental release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download Legion firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: RAK3401-legion-${{ github.sha }}
          path: dist/legion
      - name: Validate release assets
        id: metadata
        run: python3 scripts/prepare_release.py --directory dist/legion --commit "$GITHUB_SHA"
      - name: Publish UF2, OTA ZIP and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [[ "$(cat release-state.txt)" == "false" ]]; then
              echo "Release already published; preserving its assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" --notes-file release-notes.md \
              --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" dist/legion/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Withdraw releases with defective BLE DFU entry
        if: startsWith(steps.metadata.outputs.tag, 'legion-v0.3.5-')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == "false" ]]
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == "legion-v0.2.0-e27b9db" or .tag_name == "legion-v0.3.0-d828b8d") | .id' \
            > withdrawn-release-ids.txt
          while IFS= read -r release_id; do
            [[ "$release_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          done < withdrawn-release-ids.txt
