name: Build RAK3401 Legion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'

concurrency:
  group: legion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[docs-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [legion, baseline]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tools
        run: python -m pip install -r requirements.txt
      - name: Check recovery integration test prerequisites
        shell: bash
        run: |
          if ! pkg-config --exists openssl; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config
          fi
      - name: Check checkout protection and release validation
        run: python -m unittest discover -s tests -v
      - name: Build firmware and package source
        run: python scripts/build.py --target '${{ matrix.target }}'
      - name: Upload firmware, source and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RAK3401-${{ matrix.target }}-${{ github.sha }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish alpha prerelease
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download Legion firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: RAK3401-legion-${{ github.sha }}
          path: dist/legion
      - name: Validate release assets
        id: metadata
        run: python3 scripts/prepare_release.py --directory dist/legion --commit "$GITHUB_SHA"
      - name: Publish UF2, OTA ZIP and corresponding source
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [[ "$(cat release-state.txt)" == "false" ]]; then
              echo "Release already published; preserving its assets."
              echo "preserved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" --notes-file release-notes.md \
              --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" dist/legion/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          echo "preserved=false" >> "$GITHUB_OUTPUT"
      - name: Verify published asset sizes, hashes and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PRESERVED: ${{ steps.publication.outputs.preserved }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > published-release.json
          gh release download "$RELEASE_TAG" --dir published-assets
          if [[ "$PRESERVED" != "true" ]]; then
            cmp dist/legion/SHA256SUMS published-assets/SHA256SUMS
          fi
          python3 scripts/verify_published_release.py \
            --directory published-assets --commit "$GITHUB_SHA" < published-release.json

  documentation:
    name: Update existing release documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[docs-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate documentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path
          before = os.environ["BEFORE_SHA"]
          allowed = {
              "README.md", "DFU.md", "RECOVERY.md", "COMMANDS.md", "CHANGELOG.md", "APC.md",
              "RELEASE_NOTES.md", "ENERGY-RECOVERY.md", "ALPHA-TESTING.md", "PLANNING-0.6.0.md",
              "upstream.json", "scripts/prepare_release.py", "scripts/build.py",
              "tests/test_release.py", ".github/workflows/build.yml",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", before, "HEAD"], text=True
          ).splitlines())
          if changed - allowed:
              raise SystemExit(f"Non-documentation changes: {sorted(changed - allowed)}")
          if "scripts/build.py" in changed:
              previous = subprocess.check_output(
                  ["git", "show", f"{before}:scripts/build.py"], text=True
              )
              current = Path("scripts/build.py").read_text()
              for document in ("ALPHA-TESTING.md", "PLANNING-0.6.0.md", "ENERGY-RECOVERY.md"):
                  entry = f'            "{document}",\n'
                  previous = previous.replace(entry, "")
                  current = current.replace(entry, "")
              if previous != current:
                  raise SystemExit("Build changes exceed documentation archive entries")
          old = json.loads(subprocess.check_output(
              ["git", "show", f"{before}:upstream.json"], text=True
          ))
          new = json.loads(Path("upstream.json").read_text())
          for metadata in (old, new):
              metadata.pop("ota_hardware_observation", None)
          if old != new:
              raise SystemExit("Firmware inputs changed")
          PYCODE
          python3 -m unittest discover -s tests -p test_release.py -v
          git diff --check "$BEFORE_SHA" HEAD
      - name: Select the current version's published release
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("upstream.json"))["legion_version"])')
          gh api "repos/$GH_REPO/releases?per_page=100" > current-releases.json
          release_tag=$(jq -r --arg prefix "legion-v${version}-" \
            '[.[] | select(.draft == false and (.tag_name | startswith($prefix)))][0].tag_name // empty' current-releases.json)
          [[ -n "$release_tag" ]]
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Update notes and verify existing assets are preserved
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-before.json
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-after.json
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          before = json.loads(Path("release-before.json").read_text())
          after = json.loads(Path("release-after.json").read_text())
          for key in ("id", "tag_name", "target_commitish", "draft", "prerelease", "assets"):
              if before[key] != after[key]:
                  raise SystemExit(f"Unexpected release change: {key}")
          if after["body"].strip() != Path("RELEASE_NOTES.md").read_text().strip():
              raise SystemExit("Published notes differ")
          print("Release notes updated; firmware assets and release identity preserved.")
          PYCODE
