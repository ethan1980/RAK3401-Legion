name: Repair Legion 0.6.5 illustrated manuals

on:
  push:
    branches: [main]
    paths:
      - scripts/repair_friendly_manuals.py
      - .github/workflows/repair-legion-manuals.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: illustrated-guide-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair existing bilingual illustrated PDF guides
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Reconstruct complete guides from the archived 0.6.1 edition and existing 0.6.5 update pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m pip install 'PyMuPDF==1.26.7'
          mkdir -p /tmp/legion-061-archive
          gh release download legion-v0.6.1-20985cb --pattern corresponding-source.tar.gz --dir /tmp/legion-061-archive
          tar -xzf /tmp/legion-061-archive/corresponding-source.tar.gz -C /tmp/legion-061-archive legion/docs
          python - <<'PY'
          from pathlib import Path
          import fitz
          for lang in ('Spanish','English'):
              path=Path(f'docs/Legion-{lang}-friendly-user-manual.pdf')
              recent=fitz.open(path)
              assert len(recent)==29, (lang,len(recent))
              if 'Manual 1.2' in recent[0].get_text():
                  print(lang,'already edition 1.2')
                  continue
              orig=fitz.open(Path('/tmp/legion-061-archive/legion/docs')/path.name)
              assert len(orig)==27, (lang,len(orig))
              orig.insert_pdf(recent,from_page=27,to_page=28)
              target=path.with_suffix('.reconstructed.pdf')
              orig.save(target,garbage=4,deflate=True,deflate_fonts=True,deflate_images=True)
              orig.close()
              recent.close()
              target.replace(path)
              print(lang,'reconstructed original 27 pages and 2 update pages')
          PY
      - name: Repair version, metadata, examples and APC references without changing art
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python scripts/repair_friendly_manuals.py
      - name: Validate both PDFs before publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          for lang in ('Spanish','English'):
              p=Path(f'docs/Legion-{lang}-friendly-user-manual.pdf')
              d=fitz.open(p)
              assert len(d)==29
              assert 'Legion 0.6.5' in d[0].get_text()
              assert '06 NOV 2026' in d[0].get_text()
              assert all('LEGIONFW · 0.6.5' in d[i].get_text() for i in range(1,27))
              body='\n'.join(page.get_text() for page in d)
              assert '2.8.2.Legion0.6.5' in body
              assert 'd5f1619' in body
              assert '0.6.1 estable' not in body
              assert len([i for i in range(29) if d[i].get_images()])==29
              print(f'{lang} guide: 29 pages, original illustrations preserved, metadata consistent.')
          PY
      - name: Publish corrected original PDFs to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for manual in docs/Legion-Spanish-friendly-user-manual.pdf docs/Legion-English-friendly-user-manual.pdf; do
            sha=$(gh api "repos/$GH_REPO/contents/$manual" --jq '.sha')
            base64 -w0 "$manual" > manual-base64.txt
            jq -n --arg message '[docs-only] Repair all 0.6.5 illustrated manual references' \
              --rawfile content manual-base64.txt --arg sha "$sha" \
              '{message:$message, content:$content, sha:$sha, branch:"main"}' > payload.json
            gh api -X PUT "repos/$GH_REPO/contents/$manual" --input payload.json > /dev/null
          done
