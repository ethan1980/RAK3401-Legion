[env:rak3401-legion]
extends = env:rak3401-1watt
board_level = extra
custom_meshtastic_display_name = RAK3401 Legion @LEGION_VERSION@
build_flags =
  ${env:rak3401-1watt.build_flags}
  -DRAK3401_LEGION_SPI_BULK=1
  -DRAK3401_LEGION_POWER=1
  -DRAK3401_LEGION_FLASH=1
  -DRAK3401_LEGION_TELEMETRY=1
  -DRAK3401_LEGION_DFU=1
  -DRAK3401_LEGION_RECOVERY=1
  -DRAK3401_LEGION_CONTROL=1
  -DRAK3401_LEGION_DCDC=1
  -DRAK3401_LEGION_CC310=1
  -DRAK3401_LEGION_BOOT=1
  -DRAK3401_LEGION_COMPONENTS=1
  -DRAK3401_LEGION_APC=1
  -Wl,--defsym=__legion_recovery=1
  -DRAK3401_LEGION_FIRMWARE_VERSION=@FIRMWARE_VERSION@
  -DLOW_VDD_SYSTEMOFF_DELAY_MS=5000
  -DSAFE_VDD_VOLTAGE_THRESHOLD_MV=2900
  -DSAFE_VDD_VOLTAGE_THRESHOLD_HYST_MV=100
